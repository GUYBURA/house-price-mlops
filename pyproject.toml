[project]
name = "ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
notebook = ["jupyterlab>=4.6.4", "matplotlib>=3.11.2", "seaborn>=0.13.2"]
serve = [
    "fastapi>=0.143.2",
    "google-cloud-storage>=3.17.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
default-groups = ["dev", "notebook", "serve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

name: CI

on:
    push:
        branches: [main]
    pull_request:
    
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: astral-sh/setup-uv@v6
              with:
                enable-cache: true
            
            - name: Install dependencies
              run: uv sync --locked

            - name: Lint
              run: uv run ruff check src tests

            - name: Test
              run: uv run pytest

            - name: Build Docker Image
              run: docker build -t house-price-train .

            - name: Build serving image
              run: docker build -f Dockerfile.serve -t house-price-serve .
